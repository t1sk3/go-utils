name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A weekly run catches vulnerabilities published since the last change.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version from go.mod and the latest stable release.
        go: ["1.27", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # Modules that depend on this one ignore replace directives, so a replace would
      # make the published module unbuildable.
      - name: No replace directives
        run: |
          if grep -nE '^[[:space:]]*replace' go.mod; then
            echo "Remove replace directives from go.mod."
            exit 1
          fi

      # This repository is a single module. A go.mod in a subdirectory would split off
      # a separate module that ./... silently skips and that needs its own tags.
      - name: Single module
        run: |
          extra=$(find . -name go.mod -not -path ./go.mod)
          if [ -n "$extra" ]; then
            echo "Only the root go.mod is allowed, found:"
            echo "$extra"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Benchmarks compile and run
        run: go test -run '^$' -bench . -benchtime 1x ./...

      # Each fuzz target runs briefly against fresh inputs. The seed corpus already runs
      # as part of the tests above.
      - name: Fuzz
        if: matrix.go == 'stable'
        run: |
          go test ./types/sorted -run '^$' -fuzz '^FuzzMap$' -fuzztime 20s
          go test ./types/linked -run '^$' -fuzz '^FuzzMap$' -fuzztime 20s
          go test ./types/deque -run '^$' -fuzz '^FuzzDeque$' -fuzztime 20s
          go test ./types/pq -run '^$' -fuzz '^FuzzQueue$' -fuzztime 20s
          go test ./types/trie -run '^$' -fuzz '^FuzzTrie$' -fuzztime 20s

  # int is 32 bits here, which the size arithmetic in stream.Range and friends has to
  # get right. The race detector does not support this platform.
  test-32bit:
    name: Test (32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Test
        run: GOARCH=386 go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      # The module has no dependencies, so this reports vulnerabilities in the parts of
      # the standard library that the code calls.
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
