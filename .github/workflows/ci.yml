name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version from go.mod and the latest stable release.
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # The repository holds several modules (the root and ./types), and ./... stops
      # at module boundaries, so every go command runs once per module.
      - name: Vet
        run: for m in $(dirname $(find . -name go.mod)); do (cd "$m" && go vet ./...) || exit 1; done

      - name: Check go.mod is tidy
        run: for m in $(dirname $(find . -name go.mod)); do (cd "$m" && go mod tidy -diff) || exit 1; done

      - name: Test
        run: for m in $(dirname $(find . -name go.mod)); do (cd "$m" && go test -race -cover ./...) || exit 1; done

      - name: Benchmarks compile and run
        run: for m in $(dirname $(find . -name go.mod)); do (cd "$m" && go test -run '^$' -bench . -benchtime 1x ./...) || exit 1; done
